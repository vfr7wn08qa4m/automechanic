# GitHub Actions: один тик конвейера AutoMech под ОДНИМ аккаунтом/репо.
# Без кольца и без эстафеты аккаунтам — расписание держит нативный cron ниже.
# Секреты (Settings -> Secrets and variables -> Actions -> New repository secret):
#   ADO_ORG, ADO_PROJECT, ADO_PAT                — доска Azure DevOps
#   YOUTUBE_API_KEY                              — discovery (опц., есть yt-dlp фолбэк)
#   DISTILL_API_KEY / NIM_API_KEY / KIMI_API_KEY  — дистилляция (теперь выполняется
#                                                    непосредственно в этом тике)
#   SUPADATA_API_KEY, YTDLP_PROXY                — субтитры/прокси (опц.)
#   CRAWL_PROXY, CRAWL_PROXY_KEY                 — форум-краул (опц.)
#   S3_ENDPOINT, S3_KEY, S3_SECRET               — архив (опц.)
#   QDRANT_URL, QDRANT_API_KEY                   — индекс (опц.)
#   BACKUP_REPO, BACKUP_GITHUB_TOKEN             — репо ежедневного бэкапа (опц.)

name: automech-tick

on:
  workflow_dispatch:      # ручной запуск для теста кольца или явного пуша
    inputs:
      task:
        description: "Force specific task (subs/forums/delta/distill/embed/discover/asr) or random if empty"
        required: false
        default: ""
      run_all:
        description: "TEST MODE: Run ALL tasks in random order (subs→forums→delta→embed→discover)"
        required: false
        default: "false"
      batch:
        description: "Batch size (для ring handoff)"
        required: false
        default: "3"
      partition:
        description: "Partition (для ring handoff)"
        required: false
        default: "solo"
      idle:
        description: "Ring IDLE counter (для ring handoff)"
        required: false
        default: "0"

concurrency:
  group: automech-tick-${{ github.actor }}
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg СТАТИЧЕСКИМ БИНАРЕМ, без apt. Через apt он тянет ~30 пакетов (libav*,
      # libva, шрифты) и однажды завис на 45 мин, убив джобу по общему таймауту и
      # вместе с ней всю эстафету. Тут — один архив с релизов GitHub (тот же ЦОД,
      # что и раннер), распаковка двух файлов, ~10 сек. Кэш делает повтор мгновенным.
      - name: кэш ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/ffmpeg-static
          key: ffmpeg-static-linux64-gpl-v1

      - name: ffmpeg (для ASR) — статический бинарь, без apt
        timeout-minutes: 5
        continue-on-error: true
        run: |
          DEST=~/.local/bin/ffmpeg-static
          if [ ! -x "$DEST/ffmpeg" ]; then
            mkdir -p "$DEST" && cd "$DEST"
            curl -sSL --retry 3 --max-time 240 -o ff.tar.xz \
              https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf ff.tar.xz --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
            rm -f ff.tar.xz
          fi
          chmod +x "$DEST"/ffmpeg "$DEST"/ffprobe
          echo "$DEST" >> "$GITHUB_PATH"
          "$DEST/ffmpeg" -version | head -1

      - name: зависимости + Chromium (tubetranscript / краулер форумов)
        # Свой таймаут на шаг: если apt в --with-deps залипнет, шаг умрёт за 12 мин,
        # а тик ниже всё равно выполнится (if: always()) и передаст баттон дальше.
        timeout-minutes: 12
        continue-on-error: true
        run: |
          pip install -q "yt-dlp[default,curl-cffi]" playwright -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: один тик конвейера
        # always(): даже если шаг зависимостей упал по своему таймауту, тик обязан
        # запуститься — ci_tick ловит ошибку задачи сам и в ЛЮБОМ случае зовёт
        # ring_handoff. Иначе один залипший apt останавливает всё кольцо.
        if: always()
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          CI_ACCOUNT: ${{ github.actor }}
          RING_TOKENS: ${{ secrets.RING_TOKENS }}
          ADO_ORG: ${{ secrets.ADO_ORG }}
          ADO_PROJECT: ${{ secrets.ADO_PROJECT }}
          ADO_PAT: ${{ secrets.ADO_PAT }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISTILL_API_KEY: ${{ secrets.DISTILL_API_KEY }}
          DISTILL_BASE_URL: ${{ secrets.DISTILL_BASE_URL }}
          DISTILL_MODEL: ${{ secrets.DISTILL_MODEL }}
          DISTILL_ENDPOINTS: ${{ secrets.DISTILL_ENDPOINTS }}
          # без этих трёх переменных DISTILL_ENDPOINTS ссылается на несуществующие
          # env-имена — os.getenv возвращает "", и _endpoints() тихо пропускает все
          # 3 ключа Gemini, оставляя в каскаде один Kimi (найдено 2026-07-31: healthcheck
          # на кольце пробовал ТОЛЬКО k3, хотя секреты GEMINI_KEY_1/2/3 были на месте).
          GEMINI_KEY_1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_KEY_2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_KEY_3: ${{ secrets.GEMINI_KEY_3 }}
          GEMINI_KEY_4: ${{ secrets.GEMINI_KEY_4 }}
          GEMINI_KEY_5: ${{ secrets.GEMINI_KEY_5 }}
          GEMINI_KEY_6: ${{ secrets.GEMINI_KEY_6 }}
          GEMINI_KEY_7: ${{ secrets.GEMINI_KEY_7 }}
          DISTILL_MAX_TOKENS: ${{ secrets.DISTILL_MAX_TOKENS }}
          DISTILL_TIMEOUT_SECONDS: ${{ secrets.DISTILL_TIMEOUT_SECONDS }}
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          KIMI_BASE_URL: ${{ secrets.KIMI_BASE_URL }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ secrets.KIMI_MODEL }}
          KIMI_RPM: ${{ secrets.KIMI_RPM }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          YTDLP_PROXY: ${{ secrets.YTDLP_PROXY }}
          CRAWL_PROXY: ${{ secrets.CRAWL_PROXY }}
          CRAWL_PROXY_KEY: ${{ secrets.CRAWL_PROXY_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_KEY: ${{ secrets.S3_KEY }}
          S3_SECRET: ${{ secrets.S3_SECRET }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ secrets.QDRANT_COLLECTION }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_TOKENS: ${{ secrets.CF_TOKENS }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_GITHUB_TOKEN: ${{ secrets.BACKUP_GITHUB_TOKEN }}
          NEXT_GITHUB_TOKEN: ${{ secrets.NEXT_GITHUB_TOKEN }}
          NEXT_GITHUB_REPO: ${{ secrets.NEXT_GITHUB_REPO }}
          NEXT_GITHUB_WORKFLOW: ${{ secrets.NEXT_GITHUB_WORKFLOW }}
          # Фолбэк: настоящий размер кольца ci_trigger считает по числу токенов в
          # RING_TOKENS, чтобы это число не расходилось с реальностью при росте кольца.
          RING_SIZE: "22"
          RING_IDLE: ${{ github.event.inputs.idle || '0' }}
          BATCH: ${{ github.event.inputs.batch || '10' }}
          PARTITION: ${{ github.event.inputs.partition || 'solo' }}
          SUBTITLE_PROVIDERS: "tubetranscript"
          # РЕШЕНИЕ 2026-07-31: дистилляцию в кольце ВКЛЮЧАЕМ обратно, но теперь на
          # Gemini Flash (3 бесплатных ключа GEMINI_KEY_1/2/3, дневная квота — не
          # общая недельная, как у Kimi), Kimi остаётся хвостом каскада на случай,
          # если её недельная квота уже сброшена. Kimi одним ключом на 24 аккаунта
          # была узким местом (100% 2026-07-30, сброс только ~2026-08-04) — Gemini
          # снимает этот потолок, три ключа делят нагрузку кольца.
          W_DISTILL: "15"
          # Пока Kimi недоступна, кольцо занимается тем, что её квоты не требует:
          # добор титров и краул наполняют очередь, ASR через whisper.cpp вытягивает
          # видео без титров, эмбеддинг доводит готовые кейсы до Qdrant.
          W_SUBS: "30"
          # Эмбеддинг — конечный продукт, а квота Cloudflare (10k нейронов/сутки на
          # аккаунт) одна на Whisper и bge-m3; ротация по CF_TOKENS даёт 3 аккаунта.
          W_EMBED: "30"
          # ASR для видео БЕЗ титров (задача asr в ci_tick):
          #  аудио — convert1s + rapidapi. Оба тянут YouTube на СВОИХ серверах,
          #  поэтому датацентр-блок обходится. ПРОВЕРЕНО в облаке 2026-07-30 на
          #  GitHub-раннере: напрямую 5/5 у обоих на реальных кандидатах.
          #  Отказы поштучные и на ОДНИХ И ТЕХ ЖЕ видео у обоих -> второй провайдер
          #  нужен как запас на осечки, а не для обхода блока.
          #  ⚠️ Через CRAWL_PROXY аудио НЕ гонять: в облаке 0/5 (convert1s 403,
          #  rapidapi 401 — релей срезает x-rapidapi-key).
          #  yt-dlp убран: с раннера бот-блок, с домашнего IP не заработал.
          #  распознавание — Whisper на Cloudflare (CF_* уже заданы выше). Раннер почти
          #  не грузится: сеть + ffmpeg; длинное аудио режется на куски по CF_CHUNK_SEC
          #  (CF отдаёт 413 на ~2.9МБ; 5 мин ≈ 0.9МБ проходит).
          AUDIO_PROVIDERS: "convert1s,rapidapi"
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          #  Распознавание: cloudflare -> whisper.cpp. CF дешевле по минутам
          #  раннера, но 10k нейронов/сутки на аккаунт и квота ОБЩАЯ с эмбеддингом;
          #  ротация по CF_TOKENS есть теперь и в asr.py (было: один аккаунт, весь
          #  ASR падал на его 429). Когда все CF-аккаунты в 429 — whisper.cpp
          #  (ggml-org) прямо НА РАННЕРЕ: квот нет вовсе, платим только минутами.
          #  Собирается по требованию (ci_tick._ensure_whispercpp), чтобы сборка
          #  не висела гирей на каждом тике — задача asr выпадает редко.
          ASR_PROVIDERS: "cloudflare,whispercpp"
          ASR_LOCAL_MODEL: "base"
          # Пока Kimi в нуле, ASR — самая полезная работа кольца: он не трогает ни
          # квоту Kimi, ни (через whisper.cpp) квоту Cloudflare, и превращает видео
          # без титров в материал, который дистиллируется потом.
          W_ASR: "35"
          CF_CHUNK_SEC: "300"
        run: |
          echo "[workflow] GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "[workflow] github.actor=${{ github.actor }}"
          echo "[workflow] Running ci_tick.py..."

          TASK_ARG=""
          if [ -n "${{ github.event.inputs.task }}" ]; then
            TASK_ARG="--task ${{ github.event.inputs.task }}"
          fi
          RUN_ALL_ARG=""
          if [ "${{ github.event.inputs.run_all }}" = "true" ]; then
            RUN_ALL_ARG="--run-all"
          fi
          python scripts/ci_tick.py --batch "$BATCH" --partition "$PARTITION" $TASK_ARG $RUN_ALL_ARG
